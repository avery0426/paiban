<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>排班日历</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --bg: #f4f6fb; --card: #fff; --line: #e6eaf2;
    --text: #1f2937; --sub: #6b7280; --pri: #2563eb; --pri-d: #1d4ed8;
    --c-white: #dbeafe; --c-white-t: #1e40af;
    --c-night: #ede9fe; --c-night-t: #5b21b6;
    --c-rest: #eef2f7;  --c-rest-t: #64748b;
    --c-custom: #fce7f3; --c-custom-t: #be185d;
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); font-size: 15px; line-height: 1.5;
    padding-bottom: calc(86px + var(--safe-b));
  }

  /* 提示框 */
  .toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-20px);
    background: #333; color: #fff; padding: 10px 20px; border-radius: 20px;
    font-size: 14px; opacity: 0; pointer-events: none; transition: .3s; z-index: 999;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* 顶栏 */
  .topbar {
    position: sticky; top: 0; z-index: 40; background: rgba(255,255,255,.9);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner {
    max-width: 720px; margin: 0 auto; display: flex; align-items: center;
    justify-content: space-between; padding: 11px 16px;
  }
  .brand b { font-size: 17px; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 12px; border: 1px solid var(--line);
    background: #fff; color: #475569; display: flex; align-items: center; justify-content: center;
  }
  .icon-btn:active { background: #f1f5f9; }

  .wrap { max-width: 720px; margin: 0 auto; padding: 14px 14px 0; }

  /* 设置面板 */
  .panel {
    background: var(--card); border-radius: 16px; padding: 16px;
    box-shadow: 0 1px 3px rgba(16,24,40,.07); margin-bottom: 14px;
    display: none;
  }
  .panel.open { display: block; }
  .field { margin-bottom: 14px; }
  .field > label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
  input, select, textarea {
    width: 100%; font-size: 16px; font-family: inherit; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 11px; background: #fff;
    outline: none; -webkit-appearance: none;
  }
  textarea { resize: vertical; min-height: 60px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  
  .row-btns { display: flex; gap: 10px; margin-top: 14px; }
  .btn-soft {
    flex: 1; min-height: 44px; border-radius: 11px; border: 1px solid var(--line);
    background: #fff; color: #475569; font-size: 14px; font-weight: 600;
  }
  .btn-danger { border-color: #fecaca; color: #dc2626; background: #fef2f2; }

  /* 统计 & 图例 */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 14px; padding: 12px 8px; text-align: center; box-shadow: 0 1px 2px rgba(16,24,40,.06); }
  .stat .k { font-size: 11px; color: var(--sub); margin-bottom: 3px; }
  .stat .v { font-size: 21px; font-weight: 800; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: #475569; padding: 0 4px 10px; }
  .legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; margin-right: 4px; }
  .legend .who { margin-left: auto; color: #94a3b8; }

  /* 日历 */
  .month { background: #fff; border-radius: 16px; padding: 14px 10px 12px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(16,24,40,.06); }
  .month-head { display: flex; justify-content: space-between; padding: 0 4px 10px; }
  .month-head .ym { font-size: 16px; font-weight: 800; }
  .month-head .ms { font-size: 11.5px; color: var(--sub); }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; margin-bottom: 5px; }
  .week span { text-align: center; font-size: 11px; font-weight: 700; color: #94a3b8; }
  .week span.we { color: #f59e0b; }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  
  .cell {
    min-height: 56px; border-radius: 10px; background: #f8fafc;
    padding: 4px 2px; display: flex; flex-direction: column; align-items: center; gap: 3px;
    border: 1px solid transparent; position: relative; cursor: pointer;
  }
  .cell.blank { background: transparent; pointer-events: none; }
  .cell.we { background: #fff8f0; }
  .cell.today { border-color: var(--pri); }
  .cell.overridden::after {
    content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px;
    border-radius: 50%; background: #ec4899;
  }
  .cell .d { font-size: 11.5px; font-weight: 700; color: #475569; }
  .cell.we .d { color: #d97706; }
  .chip { font-size: 10.5px; font-weight: 800; padding: 4px 6px; border-radius: 6px; white-space: nowrap; }
  .chip.w { background: var(--c-white); color: var(--c-white-t); }
  .chip.n { background: var(--c-night); color: var(--c-night-t); }
  .chip.r { background: var(--c-rest);  color: var(--c-rest-t); }
  .chip.c { background: var(--c-custom); color: var(--c-custom-t); }

  /* 底部按钮 */
  .actionbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    padding: 10px 14px calc(10px + var(--safe-b));
    background: rgba(255,255,255,.94); border-top: 1px solid var(--line);
  }
  .btn-main {
    width: 100%; max-width: 720px; margin: 0 auto; display: block;
    min-height: 50px; border: 0; border-radius: 14px;
    background: var(--pri); color: #fff; font-size: 16px; font-weight: 700;
  }
  .btn-main:active { background: var(--pri-d); }

  /* 弹窗 */
  .sheet-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100; display: none;
  }
  .sheet-overlay.open { display: block; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 101; background: #fff;
    border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + var(--safe-b));
    transform: translateY(100%); transition: transform .2s;
    max-width: 720px; margin: 0 auto;
  }
  .sheet.open { transform: translateY(0); }
  .sheet-head { text-align: center; margin-bottom: 18px; }
  .sheet-head h3 { margin: 0; font-size: 18px; }
  .opt-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 16px; }
  .opt-btn {
    padding: 14px 0; border-radius: 10px; border: 1px solid var(--line); background: #fff;
    font-size: 15px; font-weight: 600;
  }
  .opt-btn.custom-input { grid-column: span 4; padding: 10px; font-size: 14px; margin-top: 4px; }
  .btn-close-sheet { width: 100%; padding: 14px; border-radius: 12px; border: 0; background: #f1f5f9; font-size: 15px; }
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<header class="topbar">
  <div class="topbar-inner">
    <div class="brand"><b>排班日历</b></div>
    <button class="icon-btn" id="settingsBtn" type="button">⚙️</button>
  </div>
</header>

<div class="wrap">
  <section class="panel" id="panel">
    <div class="grid2">
      <div class="field">
        <label>开始日期</label>
        <input type="date" id="startDate">
      </div>
      <div class="field">
        <label>结束日期</label>
        <input type="date" id="endDate">
      </div>
    </div>

    <div class="field">
      <label>员工名单</label>
      <textarea id="employeeText" rows="1" placeholder="例如：徐湘轩"></textarea>
    </div>

    <div class="field">
      <label>循环规则</label>
      <input type="text" id="patternText" value="白白夜夜休休" placeholder="如：白白夜夜休休">
      <div style="font-size:12px;color:#94a3b8;margin-top:6px;">按字识别，如“白夜休”</div>
    </div>

    <div class="field">
      <label>起始状态</label>
      <select id="startPhase"></select>
    </div>

    <div class="row-btns">
      <button class="btn-soft btn-danger" id="clearOverrides" type="button">清除微调</button>
    </div>
  </section>

  <div id="result"></div>
</div>

<div class="actionbar">
  <button class="btn-main" id="generate" type="button">生成排班日历</button>
</div>

<div class="sheet-overlay" id="sheetOverlay"></div>
<div class="sheet" id="sheet">
  <div class="sheet-head">
    <h3 id="sheetTitle">修改班次</h3>
  </div>
  <div class="opt-grid">
    <button class="opt-btn" data-val="白">白班</button>
    <button class="opt-btn" data-val="夜">夜班</button>
    <button class="opt-btn" data-val="休">休息</button>
    <button class="opt-btn" data-val="病">病假</button>
    <input type="text" class="opt-btn custom-input" id="customInput" placeholder="输入自定义（如：事假）按回车确认">
  </div>
  <button class="btn-close-sheet" id="closeSheet">取消</button>
</div>

<script>
(function() {
  // 显示提示
  function showToast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function() { t.classList.remove('show'); }, 2000);
  }

  var state = {
    employees: [],
    patternArr: ['白', '白', '夜', '夜', '休', '休'],
    overrides: {}
  };

  var pad = function(n) { return n < 10 ? '0' + n : n; };
  var toISO = function(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };
  var fmt = function(d) { return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); };

  function getChipClass(shift) {
    if (shift === '白') return 'w';
    if (shift === '夜') return 'n';
    if (shift === '休') return 'r';
    return 'c';
  }

  // 解析规则
  function parsePattern() {
    var val = document.getElementById('patternText').value.trim() || '白白夜夜休休';
    val = val.replace(/[\s,，、;；]+/g, '');
    state.patternArr = val.split('');
    if (state.patternArr.length === 0) state.patternArr = ['白', '白', '夜', '夜', '休', '休'];
    
    var select = document.getElementById('startPhase');
    var oldVal = select.value;
    select.innerHTML = '';
    for (var i = 0; i < state.patternArr.length; i++) {
      var opt = document.createElement('option');
      opt.value = i;
      opt.textContent = '第 ' + (i + 1) + ' 天 (' + state.patternArr[i] + ')';
      select.appendChild(opt);
    }
    if (oldVal && parseInt(oldVal) < state.patternArr.length) select.value = oldVal;
  }

  // 核心生成逻辑
  function generate() {
    // 1. 强制兜底，防止空值
    var empInput = document.getElementById('employeeText');
    if (!empInput.value.trim()) empInput.value = '徐湘轩';
    
    var startInput = document.getElementById('startDate');
    if (!startInput.value) startInput.value = toISO(new Date());
    
    var endInput = document.getElementById('endDate');
    if (!endInput.value) {
      var d = new Date(); d.setDate(d.getDate() + 29);
      endInput.value = toISO(d);
    }

    // 2. 读取数据
    var start = startInput.value;
    var end = endInput.value;
    var empStr = empInput.value;
    
    state.employees = [];
    var parts = empStr.split(/[\n,，、;；]+/);
    for (var i=0; i<parts.length; i++) {
      var name = parts[i].trim();
      if (name && state.employees.indexOf(name) === -1) state.employees.push(name);
    }

    if (end < start) {
      showToast('结束日期不能早于开始日期');
      return;
    }

    parsePattern();
    var offset = parseInt(document.getElementById('startPhase').value) || 0;

    // 3. 计算日期
    var dates = [];
    var cur = new Date(start + 'T00:00:00');
    var endD = new Date(end + 'T00:00:00');
    
    while (cur <= endD && dates.length < 400) {
      dates.push(new Date(cur));
      cur.setDate(cur.getDate() + 1);
    }

    if (dates.length === 0) {
      showToast('日期范围无效');
      return;
    }

    // 4. 生成数据
    var pLen = state.patternArr.length;
    var rows = [];
    for (var di = 0; di < dates.length; di++) {
      var date = dates[di];
      var dateKey = fmt(date);
      var phases = {};
      var isOverride = !!state.overrides[dateKey];
      
      for (var ei = 0; ei < state.employees.length; ei++) {
        var name = state.employees[ei];
        var s = state.patternArr[(di + offset + ei) % pLen];
        if (isOverride) s = state.overrides[dateKey];
        phases[name] = s;
      }
      rows.push({ date: date, dateKey: dateKey, phases: phases, isOverride: isOverride });
    }

    render(rows, offset);
    
    // 自动收起面板并提示成功
    document.getElementById('panel').classList.remove('open');
    showToast('排班生成成功');
  }

  // 渲染页面
  function render(rows, offset) {
    var single = state.employees.length === 1;
    var html = '';

    // 统计
    html += '<div class="stats">';
    if (single) {
      var counts = {};
      for (var i=0; i<rows.length; i++) {
        var s = rows[i].phases[state.employees[0]];
        counts[s] = (counts[s] || 0) + 1;
      }
      html += '<div class="stat"><div class="k">白班</div><div class="v" style="color:#1e40af">' + (counts['白']||0) + '</div></div>';
      html += '<div class="stat"><div class="k">夜班</div><div class="v" style="color:#5b21b6">' + (counts['夜']||0) + '</div></div>';
      html += '<div class="stat"><div class="k">休息</div><div class="v" style="color:#64748b">' + (counts['休']||0) + '</div></div>';
    } else {
      html += '<div class="stat"><div class="k">员工</div><div class="v">' + state.employees.length + '</div></div>';
      html += '<div class="stat"><div class="k">天数</div><div class="v">' + rows.length + '</div></div>';
      html += '<div class="stat"><div class="k">规则</div><div class="v" style="font-size:12px;padding-top:6px">' + state.patternArr.join('') + '</div></div>';
    }
    html += '</div>';

    // 图例
    html += '<div class="legend">';
    html += '<span><i style="background:#dbeafe"></i>白班</span>';
    html += '<span><i style="background:#ede9fe"></i>夜班</span>';
    html += '<span><i style="background:#eef2f7"></i>休息</span>';
    if (single) {
      html += '<span class="who">' + state.employees[0] + ' · 起始' + state.patternArr[offset] + '</span>';
    }
    html += '</div>';

    // 按月份分组
    var monthsMap = {};
    for (var i=0; i<rows.length; i++) {
      var r = rows[i];
      var mk = r.date.getFullYear() + '-' + r.date.getMonth();
      if (!monthsMap[mk]) monthsMap[mk] = { y: r.date.getFullYear(), m: r.date.getMonth(), days: {} };
      monthsMap[mk].days[r.date.getDate()] = r;
    }

    var todayKey = fmt(new Date());
    var mKeys = Object.keys(monthsMap).sort();

    for (var k=0; k<mKeys.length; k++) {
      var mo = monthsMap[mKeys[k]];
      var first = new Date(mo.y, mo.m, 1);
      var dim = new Date(mo.y, mo.m + 1, 0).getDate();
      var lead = (first.getDay() + 6) % 7;

      html += '<div class="month">';
      html += '<div class="month-head"><span class="ym">' + mo.y + '年' + (mo.m + 1) + '月</span></div>';
      
      html += '<div class="week">';
      var wNames = ['一','二','三','四','五','六','日'];
      for (var w=0; w<7; w++) html += '<span class="' + (w>=5?'we':'') + '">' + wNames[w] + '</span>';
      html += '</div>';

      html += '<div class="grid">';
      for (var l=0; l<lead; l++) html += '<div class="cell blank"></div>';

      for (var d=1; d<=dim; d++) {
        var col = (lead + d - 1) % 7;
        var we = col >= 5;
        var key = mo.y + '-' + pad(mo.m + 1) + '-' + pad(d);
        var data = mo.days[d];
        
        var cls = 'cell' + (we ? ' we' : '') + (key === todayKey ? ' today' : '');
        if (data && data.isOverride) cls += ' overridden';

        html += '<div class="' + cls + '" data-date="' + key + '">';
        html += '<span class="d">' + d + '</span>';

        if (data) {
          if (single) {
            var s = data.phases[state.employees[0]];
            html += '<span class="chip ' + getChipClass(s) + '">' + s + '</span>';
          } else {
            for (var ei=0; ei<state.employees.length; ei++) {
              var name = state.employees[ei];
              var s = data.phases[name];
              html += '<div style="font-size:9px;color:#64748b">' + name + ' <span class="chip mini ' + getChipClass(s) + '">' + s + '</span></div>';
            }
          }
        }
        html += '</div>';
      }
      var total = lead + dim;
      var tail = (7 - total % 7) % 7;
      for (var i=0; i<tail; i++) html += '<div class="cell blank"></div>';
      html += '</div></div>';
    }

    document.getElementById('result').innerHTML = html;

    // 绑定点击
    var cells = document.querySelectorAll('.cell:not(.blank)');
    for (var i=0; i<cells.length; i++) {
      cells[i].onclick = function() {
        openSheet(this.getAttribute('data-date'));
      };
    }
  }

  // 弹窗控制
  var editingDate = null;

  function openSheet(dateKey) {
    if (!dateKey) return;
    editingDate = dateKey;
    var d = new Date(dateKey + 'T00:00:00');
    document.getElementById('sheetTitle').textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 修改';
    document.getElementById('customInput').value = '';
    
    document.getElementById('sheetOverlay').classList.add('open');
    document.getElementById('sheet').classList.add('open');
  }

  function closeSheet() {
    document.getElementById('sheetOverlay').classList.remove('open');
    document.getElementById('sheet').classList.remove('open');
    editingDate = null;
  }

  function saveOverride(val) {
    if (!editingDate) return;
    if (!val) {
      delete state.overrides[editingDate];
    } else {
      state.overrides[editingDate] = val;
    }
    closeSheet();
    generate(); // 重新生成，不弹出成功提示
  }

  // 初始化
  function init() {
    // 1. 设置默认日期
    var today = new Date();
    var later = new Date();
    later.setDate(today.getDate() + 29);
    
    document.getElementById('startDate').value = toISO(today);
    document.getElementById('endDate').value = toISO(later);
    document.getElementById('employeeText').value = '徐湘轩';

    // 2. 绑定事件
    document.getElementById('settingsBtn').onclick = function() {
      document.getElementById('panel').classList.toggle('open');
    };

    document.getElementById('generate').onclick = generate;

    document.getElementById('patternText').oninput = parsePattern;

    document.getElementById('closeSheet').onclick = closeSheet;
    document.getElementById('sheetOverlay').onclick = closeSheet;

    // 弹窗里的快捷按钮
    var optBtns = document.querySelectorAll('.opt-btn[data-val]');
    for (var i=0; i<optBtns.length; i++) {
      optBtns[i].onclick = function() {
        saveOverride(this.getAttribute('data-val'));
      };
    }

    document.getElementById('customInput').onkeydown = function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        saveOverride(this.value.trim());
      }
    };

    document.getElementById('clearOverrides').onclick = function() {
      state.overrides = {};
      generate();
      showToast('已清除所有微调');
    };

    // 3. 首次自动生成，展示日历
    generate();
  }

  // 确保 DOM 加载完成
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
